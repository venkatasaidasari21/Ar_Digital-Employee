name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Install, build, typecheck, test, format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test
        run: bun test
      - name: Format check
        run: bunx prettier --check .
      - name: Dependency audit
        # Gate strictly on production-vulnerability posture. bun audit used to
        # report 6 advisories in build-time transitive toolchain deps (nanoid +
        # postcss via vite, js-yaml via @tanstack/react-start build plugins) that
        # had no compatible-version upgrade. package.json "overrides" now pin
        # those transitive deps to the patched releases (3.3.18 / 8.5.26 / 4.3.1),
        # so `bun audit --production` exits 0 ("No vulnerabilities found"). If it
        # ever exits non-zero again that is a real production-vulnerability
        # regression and must fail the pipeline -- no silent ignoring.
        run: bun audit --production
