name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Install, build, typecheck, test, format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test
        run: bun test
      - name: Format check
        run: bunx prettier --check .
      - name: Dependency audit
        # bun audit is wired in so every push/PR surfaces the current dependency
        # security posture. It currently reports several advisories in transitive
        # toolchain deps (vite/postcss/nanoid and @tanstack/react-start/js-yaml)
        # that pin below the fixed versions with no compatible-version upgrade yet.
        # continue-on-error logs them without blocking the pipeline; flip it to
        # strict once those advisories are resolvable upstream.
        run: bun audit --production
        continue-on-error: true
